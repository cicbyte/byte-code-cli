[package]
name = "bcode"
version = "0.0.6"
edition = "2024"
description = "ByteCode CLI — 外部 coding agent 与 ByteCode 平台之间的本地桥"
license = "MIT"
repository = "https://github.com/cicbyte/byte-code-cli"
build = "build.rs"

# cargo-binstall 直装模板：资产命名与 .github/workflows/release.yml 的
# bcode-<target>.tar.gz / .zip 对应；Windows 资产是 zip，需按 target 覆盖
# pkg-fmt（默认 tar.gz 会导致 404 回退源码安装）
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
# 归档内有 bcode-<target>/ 层级目录（与 release.yml 打包结构对应）
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "stream"] }
unicode-width = "0.2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
toml = "0.8"
dirs = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
strip = true
