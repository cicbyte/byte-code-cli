[package]
name = "bcode"
version = "0.0.1"
edition = "2024"
description = "ByteCode CLI — 外部 coding agent 与 ByteCode 平台之间的本地桥"
license = "MIT"
repository = "https://github.com/cicbyte/byte-code-cli"
build = "build.rs"

# cargo-binstall 直装模板：资产命名与 .github/workflows/release.yml 的
# bcode-<target>.tar.gz / .zip 对应（archive-suffix 按平台自动取 .tar.gz/.zip）
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "stream"] }
unicode-width = "0.2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
toml = "0.8"
dirs = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
strip = true
